[project]
name = "instant-quoting-engine"
version = "1.0.0"
description = "AI micro-service: STEP upload -> machine selection, lead time and VAT-compliant quote"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM"]
ignore = ["S101", "B008", "S311", "E501", "SIM108", "SIM114"]  # E501: the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S"]
