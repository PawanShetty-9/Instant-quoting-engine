# Render Blueprint: New > Blueprint > select this repository.
# Two Docker web services in Frankfurt (EU data residency). After the first deploy,
# set ANTHROPIC_API_KEY (optional) and adjust the URLs if you rename the services.
services:
  - type: web
    name: quote-backend
    runtime: docker
    region: frankfurt
    plan: standard            # >= 2 GB RAM for the OpenCascade kernel
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    numInstances: 1           # SQLite on a persistent disk -> single instance
    disk:
      name: quote-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: QUOTE_ADMIN_API_KEY
        generateValue: true
      - key: QUOTE_CORS_ORIGINS
        value: '["https://quote-frontend.onrender.com"]'
      # Render's proxy appends the real client IP as the last X-Forwarded-For entry;
      # the app reads exactly that one so clients cannot forge their IP to dodge quotas.
      - key: QUOTE_TRUSTED_PROXY_HOPS
        value: "1"
      - key: QUOTE_PUBLIC_APP_URL
        value: https://quote-frontend.onrender.com
      # Stripe (test mode first: sk_test_... / whsec_...). Webhook endpoint:
      #   https://quote-backend.onrender.com/api/v1/billing/webhook
      - key: QUOTE_STRIPE_SECRET_KEY
        sync: false
      - key: QUOTE_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"

  - type: web
    name: quote-frontend
    runtime: docker
    region: frankfurt
    plan: starter
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    envVars:
      # Build-time (inlined into the browser bundle): public URL of the backend service.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://quote-backend.onrender.com
